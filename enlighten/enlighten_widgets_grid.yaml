 # ==================================================================
# This include file expects substitutions defined for the following variables:
#  enlighten_x
#  enlighten_y
#  enlighten_width
#  enlighten_height
# 
# ==================================================================

obj:
  x: ${enlighten_x}
  y: ${enlighten_y}
  width: ${enlighten_width}
  height: ${enlighten_height}

  pad_all: 0
  bg_opa: 0%
  border_width: 0
  scrollbar_mode: "OFF"
  scrollable: false
  clickable: false

  # ==================================================================
  # MAIN 5 x 5 GRID
  # ==================================================================

  layout:
    type: GRID
    pad_row: 0
    pad_column: 0

    grid_rows:
      - FR(2)
      - FR(1)
      - FR(2)
      - FR(2)
      - FR(2)
      - FR(1)

    grid_columns:
      - FR(1)
      - FR(1)
      - FR(1)
      - FR(1)
      - FR(1)

  widgets:

    # ================================================================
    # SOLAR
    #
    # Occupies columns 3-4.
    #
    #   [ icon ] [ power ]
    #             [ status ]
    # ================================================================

    - obj:
        id: solar_display

        x: 0
        y: 0
        width: 100%
        height: 100%

        pad_all: 0
        bg_opa: 0%
        border_width: 0
        scrollbar_mode: "OFF"
        scrollable: false
        clickable: false

        grid_cell_row_pos: 0
        grid_cell_column_pos: 2
        grid_cell_column_span: 2

        widgets:

          - label:
              id: solar_icon
              text: "\U000F0A72"
              text_font: other_icons_100
              text_color: 0x0055FF
              text_align: CENTER

              x: 0
              y: 0
              width: 100
              height: 100%

          - label:
              id: solar_production_value_lable
              text: "--kW"
              text_font: montserrat_32
              text_color: 0x0055FF
              text_align: LEFT

              x: 100
              y: 10
              width: 200
              height: 50

          - label:
              id: solar_status_label
              text: "Producing"
              text_font: montserrat_26
              text_color: 0x000000
              text_align: LEFT

              x: 100
              y: 50
              width: 200
              height: 50

    # ================================================================
    # BATTERY
    #
    # Occupies rows 4-5, columns 3-4.
    #
    #   [ icon ] [ power  ]
    #   [   %   ] [ status ]
    # ================================================================

    - obj:
        id: battery_display

        x: 0
        y: 0
        width: 100%
        height: 100%

        pad_all: 0
        bg_opa: 0%
        border_width: 0
        scrollbar_mode: "OFF"
        scrollable: false
        clickable: false

        grid_cell_row_pos: 4
        grid_cell_column_pos: 2
        grid_cell_column_span: 2
        grid_cell_row_span: 2
        
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH

        widgets:

          # ------------------------------------------------------------
          # Battery icon
          # ------------------------------------------------------------

          - label:
              id: battery_charge_icon
              text: "\U000F0091"
              text_font: battery_icons_75
              text_color: 0x009900
              text_align: CENTER

              x: 0
              y: 0
              width: 100
              height: 75

          # ------------------------------------------------------------
          # Battery percentage
          # ------------------------------------------------------------

          - label:
              id: battery_charge_lable
              text: "--%"
              text_font: montserrat_26
              text_color: 0x009900
              text_align: CENTER

              x: 0
              y: 75
              width: 100
              height: 35

          # ------------------------------------------------------------
          # Battery power
          # ------------------------------------------------------------

          - label:
              id: battery_power_lable
              text: "--kW"
              text_font: montserrat_32
              text_color: 0x009900
              text_align: LEFT

              x: 100
              y: 10
              width: 200
              height: 50

          # ------------------------------------------------------------
          # Battery status
          # ------------------------------------------------------------

          - label:
              id: battery_status_label
              text: "??"
              text_font: montserrat_26
              text_color: 0x000000
              text_align: LEFT

              x: 100
              y: 50
              width: 200
              height: 50
    # ================================================================
    # GRID
    #
    # Occupies rows 3-5, column 1.
    #
    #   [ icon ]
    #   [ power ]
    #   [ status ]
    #
    # grid_disconnected_icon overlays grid_icon.
    # ================================================================

    - obj:
        id: grid_display

        x: 0
        y: 0
        width: 100%
        height: 100%

        pad_all: 0
        bg_opa: 0%
        border_width: 0
        scrollbar_mode: "OFF"
        scrollable: false
        clickable: false

        grid_cell_row_pos: 2
        grid_cell_column_pos: 0
        grid_cell_row_span: 3
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH

        widgets:

          - label:
              id: grid_icon
              text: "\U000F0D3E"
              text_font: other_icons_100
              text_color: 0x000000
              text_align: CENTER

              x: 0
              y: 0
              width: 100%
              height: 100

          - label:
              id: grid_disconnected_icon
              text: "\U000F015A"
              text_font: other_icons_100
              text_color: 0xFF0000
              text_align: CENTER

              x: 0
              y: 0
              width: 100%
              height: 100

          - label:
              id: grid_power_value_lable
              text: "--kW"
              text_font: montserrat_32
              text_color: 0x000000
              text_align: CENTER

              x: 0
              y: 100
              width: 100%
              

          - label:
              id: grid_status_label
              text: "??"
              text_font: montserrat_26
              text_color: 0x000000
              text_align: CENTER

              x: 0
              y: 140
              width: 100%
             


    # ================================================================
    # HOUSE
    #
    # Occupies rows 3-5, column 5.
    #
    #   [ icon ]
    #   [ power ]
    #   [ status ]
    # ================================================================

    - obj:
        id: house_display

        x: 0
        y: 0
        width: 100%
        height: 100%

        pad_all: 0
        bg_opa: 0%
        border_width: 0
        scrollbar_mode: "OFF"
        scrollable: false
        clickable: false

        grid_cell_row_pos: 2
        grid_cell_column_pos: 4
        grid_cell_row_span: 3
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH

        widgets:

          - label:
              id: house_icon
              text: "\U000F07D2"
              text_font: other_icons_100
              text_align: CENTER

              x: 0
              y: 0
              width: 100%
              height: 100

          - label:
              id: house_power_value
              text: "--kW"
              text_font: montserrat_32
              text_color: 0xA58800
              text_align: CENTER

              x: 0
              y: 100
              width: 100%


          - label:
              id: house_status_label
              text: "House"
              text_font: montserrat_26
              text_color: 0xA58800
              text_align: CENTER

              x: 0
              y: 140
              width: 100%
     
    

