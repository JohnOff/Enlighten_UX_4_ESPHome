                    return ${enlighten_x} - 30 + (${enlighten_width} / 2);
                  y: !lambda |-
                        return ${enlighten_y} + ${enlighten_height} / 5;
        
                - x: !lambda |-
                    return ${enlighten_x} - 30 + (${enlighten_width} / 2);
                  y: !lambda |-
                        return ${enlighten_y} - 10 + ${enlighten_height} / 3;  

                - x: !lambda |-
                    return ${enlighten_x} - 10 + (${enlighten_width} * 4) / 5;
                  y: !lambda |-
                    return ${enlighten_y} - 10 + ${enlighten_height} / 3;  
                    

