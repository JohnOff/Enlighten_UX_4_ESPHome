
obj:
    x: ${enlighten_x}
    y: ${enlighten_y}
    width: ${enlighten_width}
    height: ${enlighten_height}

    pad_all: 0
    bg_opa: 0%
    border_width: 0
    scrollbar_mode: "OFF"
    scrollable: false
    clickable: false
    widgets:
# ====================================================================
# GRID -> HOUSE ENERGY FLOW
# ====================================================================
    - obj:
        id: grid_house_flow
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_opa: 0%
        border_opa: 0%
        shadow_opa: 0%
        outline_opa: 0%

        radius: 0
        border_width: 0
        scrollbar_mode: "OFF"

        widgets:
        # Static energy path
        - line:
            id: grid_house_line
            points:
                - x: !lambda |-
                    return 20 + ${enlighten_width} / 10;

                  y: !lambda |-
                    return  17 + ${enlighten_height} / 3;

                - x: !lambda |-
                    return  -10  + (${enlighten_width} * 4) / 5;

                  y: !lambda |-
                    return  17 + ${enlighten_height} / 3;
            
            line_width: 4            
            line_color: 0x555555
            line_rounded: true

        # Moving energy pulse
        - obj:
            id: grid_house_pulse
            x:  !lambda |-
                return 10 + ${enlighten_width} / 10;
            y:  !lambda |-
                return  7 + ${enlighten_height} / 3;
            width: 20
            height: 20
            bg_color: 0x00AEEF
            radius: 10
            border_width: 0
    # ====================================================================
    # SOLAR -> BATTERY ENERGY FLOW
    # ====================================================================
    - obj:
        id: solar_battery_flow
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_opa: 0%
        border_opa: 0%
        shadow_opa: 0%
        outline_opa: 0%

        radius: 0
        border_width: 0
        scrollbar_mode: "OFF"

        widgets:
        - line:
            id: solar_battery_line
            points:
                - x: !lambda |-
                    return   29 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  10 + ( ${enlighten_height} / 5);

                - x:  !lambda |-
                    return   29 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  10 + ( ( ${enlighten_height} *3) / 5);

            
            line_width: 4
            line_color: 0x555555
            line_rounded: true

        - obj:
            id: solar_battery_pulse
            x: !lambda |-
                return  20 + (${enlighten_width} * 2 / 5 );
                    
            y: !lambda |-
                return  ${enlighten_height} / 5;
            width: 20
            height: 20
            bg_color: 0x00AEEF
            radius: 10
            border_width: 0 
    # ====================================================================
    # BATTERY -> HOUSE ENERGY FLOW
    # ====================================================================
    - obj:
        id: battery_house_flow
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_opa: 0%
        border_opa: 0%
        shadow_opa: 0%
        outline_opa: 0%

        radius: 0
        border_width: 0
        scrollbar_mode: "OFF"

        widgets:
        - line:
            id: battery_house_line
            points:
                - x: !lambda |-
                    return   44 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                     return  10 + ( ( ${enlighten_height} *3) / 5);

                - x: !lambda |-
                    return   44 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  32 + ${enlighten_height} / 3;


                - x: !lambda |-
                    return  -10  + (${enlighten_width} * 4) / 5;
                  y: !lambda |-
                     return  32 + ${enlighten_height} / 3;


            line_width: 4
            line_color: 0x555555
            line_rounded: true

        - obj:
            id: battery_house_pulse
            x:  !lambda |-
                 return   34 + (${enlighten_width} * 2 / 5 );
            y:  !lambda |-
                 return  ( ( ${enlighten_height} *3) / 5);
            width: 20
            height: 20
            bg_color: 0x00AEEF
            radius: 10
            border_width: 0
    # ====================================================================
    # SOLAR -> HOUSE ENERGY FLOW
    # ====================================================================
    - obj:
        id: solar_house_flow
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_opa: 0%
        border_opa: 0%
        shadow_opa: 0%
        outline_opa: 0%

        radius: 0
        border_width: 0
        scrollbar_mode: "OFF"

        widgets:
        - line:
            id: solar_house_line
            points:
                - x: !lambda |-
                    return   44 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                     return  10 + ( ${enlighten_height} / 5);

                - x: !lambda |-
                    return   44 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  2 + ${enlighten_height} / 3;

                - x: !lambda |-
                    return  -10  + (${enlighten_width} * 4) / 5;
                  y: !lambda |-
                     return  2 + ${enlighten_height} / 3;
                    

            line_width: 4
            line_color: 0x555555
            line_rounded: true

        - obj:
            id: solar_house_pulse
            x: !lambda |-
                     return 34 + (${enlighten_width} * 2 / 5 );
            y: !lambda |-
                    return  (${enlighten_height} / 5);
            
            width: 20
            height: 20
            bg_color: 0x00AEEF
            radius: 10  
            border_width: 0
    # ====================================================================
    # SOLAR -> GRID ENERGY FLOW
    # ====================================================================
    - obj:
        id: solar_grid_flow
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_opa: 0%
        border_opa: 0%
        shadow_opa: 0%
        outline_opa: 0%

        radius: 0
        border_width: 0
        scrollbar_mode: "OFF"

        widgets:
        - line:
            id: solar_grid_line
            points:
                - x:  !lambda |-
                    return   14 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  10 + ( ${enlighten_height} / 5);

                - x: !lambda |-
                    return  14 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                      return  2 + ${enlighten_height} / 3;

                - x: !lambda |-
                    return  20 + (${enlighten_width} / 10);
                  y: !lambda |-
                    return  2 + ${enlighten_height} / 3; 
            line_width: 4
            line_color: 0x555555
