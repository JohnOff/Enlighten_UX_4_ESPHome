            width: 20
            height: 20 
            bg_color: 0x00AEEF
            radius: 10
            border_width: 0
   
    # ====================================================================
    # BATTERY -> Grid ENERGY FLOW
    # Note: This is hidden by default, as this is not used in this implementation.  
    # It is included for completeness, as it is a valid energy flow.
    # ====================================================================
    - obj:
        id: battery_grid_flow
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_opa: 0%
        border_opa: 0%
        shadow_opa: 0%
        outline_opa: 0%
        hidden: true
        
        radius: 0
        border_width: 0
        scrollbar_mode: "OFF"

        widgets:
        - line:
            id: battery_grid_line
            points:
                - x: !lambda |-
                    return   14 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  10 + ( ( ${enlighten_height} *3) / 5);

                - x: !lambda |-
                    return   14 + (${enlighten_width} * 2 / 5 );
                  y: !lambda |-
                    return  32 + ${enlighten_height} / 3;


                - x: !lambda |-
                    return 20 + (${enlighten_width} / 10);
                  y: !lambda |-
                    return  32 + ${enlighten_height} / 3;


            line_width: 4
            line_color: 0x555555
            line_rounded: true

        - obj:
            id: battery_grid_pulse
            x:  !lambda |-
                 return   4 + (${enlighten_width} * 2 / 5 );
            y:  !lambda |-
                 return   ( ( ${enlighten_height} *3) / 5);
            width: 20
            height: 20
            bg_color: 0x00AEEF
            radius: 10
            border_width: 0
   
      
